[package]
name = "akarin_v2"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license-file = "LICENSE"
description = "Sans-IO implementation of the auth_akarin_v2 proxy protocol (TCP and UDP, client and server)"
repository = "https://github.com/soraneoumi/akarin_v2"
readme = "README.md"
keywords = ["proxy", "protocol", "spake2", "aead"]
categories = ["network-programming", "cryptography"]

[dependencies]
aes = "0.9.2"
aes-gcm = "0.11.0"
anyhow = "1.0.104"
curve25519-dalek = "5.0.0"
hmac = "0.13.0"
parking_lot = "0.12.5"
rand = "0.10.2"
sha2 = "0.11.0"

[dev-dependencies]
hkdf = "0.13.0"
